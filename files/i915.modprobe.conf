# i915/xe power options (live on bonus /etc/modprobe.d/i915.conf)
# force up to DC6 (default -1 = auto)
options i915 enable_dc=2
# power wells off when possible
options i915 disable_power_well=1
# Enables both GuC submission and HuC authentication, which allows the GPU core to enter deep C-states cleanly.
options i915 enable_guc=3 enable_fbc=1

options xe guc_log_level=0
