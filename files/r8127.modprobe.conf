# Live bonus /etc/modprobe.d/r8127.conf
# NOTE: on the current 7.0.0-34 kernel the NIC (Realtek 8127) is actually driven
# by the in-tree r8169 driver; the out-of-tree r8127 dkms module is NOT installed.
# This file is retained for intent (ASPM on, WOL off) and applies if r8127 dkms
# is ever installed again. Harmless otherwise.
options r8127 aspm=1
options r8127 disable_wol_support=1
# blacklist r8169
