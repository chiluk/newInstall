# Reconstructed 2026-10-05 from `docker inspect` of live bonus.
# Updated 2026-10-05: homeassistant, ollama, ipex-llm-chiluk containers removed
# by user — only plex and ARM remain.
# All persistent state lives in bind mounts under /z (survives OS reinstall as long
# as the z pool is imported, not wiped).
#
# Usage after reinstall (podman):  podman-compose -f docker-compose.yml up -d
# (podman-compose is docker-compose compatible; the file itself needs no changes.
#  For the docker CLI compat socket: systemctl enable --now podman.socket,
#  then DOCKER_HOST=unix:///run/podman/podman.sock docker compose ... also works.)
services:
  plex:
    image: plexinc/pms-docker
    container_name: plex
    network_mode: host
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /z/plex/config:/config
      - /z/plex/transcode:/transcode
      - /z:/z
    environment:
      TZ: US/Central
      PLEX_UID: "1000"
      PLEX_GID: "1000"
      PLEX_CLAIM: claim-ejhBxQ7Lw3P4z2nuz6Wz
      CHANGE_CONFIG_DIR_OWNERSHIP: "true"

  ARM:
    image: automaticrippingmachine/automatic-ripping-machine:latest
    container_name: ARM
    restart: always
    privileged: true
    devices:
      - /dev/sr0:/dev/sr0
    ports:
      - "8080:8080"
    volumes:
      - /z/arm:/home/arm
      - /z/arm/logs:/home/arm/logs
      - /z/arm/config:/etc/arm/config
    environment:
      ARM_UID: "1001"
      ARM_GID: "1001"
      TZ: America/Chicago
