---
# NAS profile — synced against live bonus on 2026-10-05; packages re-synced
# 2026-10-06 against `apt-mark showmanual` (user-selected set).
# See README.md "bonus drift report" for what changed since the original nas.yml.
#
# Tags: packages, network, zfs, nfs, samba, podman, lxd, leds, security, power
- name: Create a new NAS
  hosts: nas
  become: true
  vars:
    # Physical NICs for the bond — all five names from the installer netplan.
    # Only enp2s0 is currently visible; the other four are BIOS-disabled for
    # power testing. They stay declared here so re-enabling any of them in BIOS
    # + reboot auto-enslaves them into bond0 with NO OS changes.
    # (Names recovered from the installer config: /run/systemd/network/
    #  10-netplan-{enp2s0,enp8s0,enp49s0,enp87s0,enp88s0}.network)
    bond_primary: enp2s0
    bond_slaves:
      - enp2s0
      - enp8s0
      - enp49s0
      - enp87s0
      - enp88s0

    # Kernel meta-packages per Ubuntu release (verified against
    # packages.ubuntu.com/resolute 2026-10-06). On 26.04 (resolute) the
    # -hwe-24.04 names still exist but are TRANSITIONAL stubs that just
    # pull the 26.04 metas — use the native names on resolute so the
    # transitional layer can be dropped cleanly later.
    # All other packages in this playbook keep identical names on noble
    # and resolute (checked: every apt name resolves in resolute).
    kernel_pkgs_noble:
      - linux-generic-hwe-24.04-edge
      - linux-generic
      - linux-tools-generic-7.0
      - linux-tools-generic-hwe-24.04
    kernel_pkgs_resolute:
      - linux-generic-hwe-26.04-edge
      - linux-generic
      - linux-tools-generic
      - linux-tools-generic-hwe-26.04
    kernel_pkgs: "{{ kernel_pkgs_resolute if ansible_distribution_release == 'resolute' else kernel_pkgs_noble }}"
  tasks:

  # ---------------------------------------------------------------- packages
  - name: Install server packages
    apt:
      force_apt_get: true
      state: present
      update_cache: true
      name:
        - openssh-server
        - sshuttle
        - pastebinit
        - rsnapshot
        - ubuntu-restricted-extras
        - vim
        - nfs-common
        - nfs-kernel-server
        - tree
        - net-tools
        - nmap
        - htop
        - iotop
        - screen
        - tmux
        - zfsutils-linux
        - python3-pip
        - python-is-python3
        - ufw
        - hdparm
        - smartmontools
        - fail2ban
        - btop
        # --- added since original nas.yml (present on live bonus) ---
        - atop                 # continuous process recorder (enabled+active)
        - pcp                  # performance co-pilot (pmcd/pmlogger enabled)
        - schroot              # chroot build envs
        - samba                # SMB/CIFS server ([z] share, see below)
        - unattended-upgrades  # periodic list-update + upgrade both =1
        - dkms                 # needed for led-ugreen kmod
    tags: [packages]
  # NOTE: rng-tools and libncurses5-dev from the original list are NOT installed
  # on live bonus (rng-tools removed; libncurses5-dev never installed on noble).
  # Dropped to match reality. Re-add if you actually miss them.

  - name: Install power and temp utilities
    apt:
      force_apt_get: true
      state: present
      update_cache: true
      name:
        - powertop
        - powerstat
        - intel-lpmd
        - intel-gpu-tools
        - lm-sensors
        - thermald            # enabled on live bonus
        - hd-idle             # installed+enabled but HD_IDLE_OPTS="-h" (no-op); kept for parity
    tags: [packages, power]

  # ------------------------------------------------ dev / packaging toolchain
  # User-selected (apt-mark showmanual) on live bonus, re-synced 2026-10-06.
  - name: Install dev and packaging toolchain
    apt:
      force_apt_get: true
      state: present
      name:
        - ansible
        - ansible-lint
        - build-essential
        - autoconf
        - autotools-dev
        - bison
        - debhelper
        - devscripts
        - dh-autoreconf
        - dh-translations
        - fakeroot
        - git-email
        - gitk
        - gobject-introspection
        - libdw-dev
        - libncurses-dev        # noble replacement for the old libncurses5-dev
        - manpages-dev
        - pbuilder-scripts
        - sbuild
        - ubuntu-dev-tools
        - texinfo
        - texi2html
        - texlive-fonts-recommended
        - texlive-latex-base
        - python3-full
    tags: [packages]

  # ------------------------------------------------ tracing / debugging
  - name: Install tracing and debugging tools
    apt:
      force_apt_get: true
      state: present
      name:
        - bpftrace
        - elfutils
        - fatrace
        - perf-tools-unstable
        - sysstat
        - i2c-tools
        - cscope
        - jq
        - tinymembench
    tags: [packages]

  # ------------------------------------------------ media utilities
  - name: Install media utilities
    apt:
      force_apt_get: true
      state: present
      name:
        - ffmpeg
        - ghostscript
        - mediainfo
    tags: [packages]

  # ------------------------------------------------ storage / recovery
  - name: Install storage and recovery tools
    apt:
      force_apt_get: true
      state: present
      name:
        - 7zip
        - exfatprogs
        - gddrescue
        - myrescue
        - nvme-cli
        - testdisk
        - lsscsi
        - rng-tools-debian    # noble replacement for the removed rng-tools
    tags: [packages]

  # ------------------------------------------------ kernel metas & tools
  - name: Install kernel meta-packages and tools
    # Release-conditional via kernel_pkgs var (see play vars):
    #   noble:    linux-generic-hwe-24.04-edge + linux-generic +
    #             linux-tools-generic-7.0 + linux-tools-generic-hwe-24.04
    #   resolute: linux-generic-hwe-26.04-edge + linux-generic +
    #             linux-tools-generic + linux-tools-generic-hwe-26.04
    # (live kernel is 7.0.0-34 HWE-edge, not GA; linux-generic GA meta is
    #  manual on live alongside the HWE-edge meta — box keeps both tracks)
    apt:
      force_apt_get: true
      state: present
      name: "{{ kernel_pkgs }}"
    tags: [packages]

  # ---------------------------------------------------------------- zfs pools
  # Live layout (bonus, 2026-10-05):
  #   z    = raidz1 of 3x WD100EMAZ (wwn-0x5000cca267c81707/821b0/81dcc)
  #          + special: mirror of 2x 990 PRO (part1)
  #          + logs:    mirror of 2x 990 PRO (part2)
  #          + cache:   2x 990 PRO (part3)
  #          props: atime=off, recordsize=1M, special_small_blocks=32K
  #   fast = mirror of 2x 990 PRO (part4), ashift=12, recordsize=1M
  #          (created: zpool create -o ashift=12 fast <part4> <part4-heatsink>)
  - name: List currently imported zpools
    command: zpool list -H -o name
    register: zpool_imported
    changed_when: false
    tags: [zfs]

  - name: Import zfs pools (z and fast) if not already imported
    # Imports by name; only touches pools that are exported but available.
    # Idempotent: skipped per-pool when already imported.
    command: zpool import {{ item }}
    loop: [z, fast]
    when: item not in zpool_imported.stdout
    tags: [zfs]

  - name: tune z dataset
    # Sizes given in BYTES: the community.general.zfs module compares against
    # `zfs get -H -p` (parsable/byte output), so "1M"/"32K" would never match
    # the stored 1048576/32768 and the task would report changed every run.
    zfs:
      name: z
      state: present
      extra_zfs_properties:
        atime: off
        recordsize: "1048576"  # 1M
        special_small_blocks: "32768"  # 32K
    tags: [zfs]

  - name: tune z/backup dataset
    zfs:
      name: z/backup
      state: present
      extra_zfs_properties:
        recordsize: "1048576"  # 1M
    tags: [zfs]

  - name: List zpools to detect fast
    command: zpool list -H -o name
    register: zpool_list
    changed_when: false
    tags: [zfs]

  - name: Create fast pool (L2 NVMe mirror for LXD)
    # NOTE: pool creation is destructive — only runs when pool absent.
    # Verify disk by-id paths match the target machine before running.
    command: >-
      zpool create -o ashift=12 fast
      /dev/disk/by-id/nvme-Samsung_SSD_990_PRO_2TB_S7KHNU0X711272T-part4
      /dev/disk/by-id/nvme-Samsung_SSD_990_PRO_with_Heatsink_2TB_S7DRNJ0YB05517F-part4
    when: "'fast' not in zpool_list.stdout"
    tags: [zfs, never-run-automatically]   # manual tag: review disk ids first!

  - name: tune fast dataset
    zfs:
      name: fast
      state: present
      extra_zfs_properties:
        recordsize: "1048576"  # 1M (bytes — see note on tune z dataset)
    tags: [zfs]

  - name: ZFS module options (l2arc rebuild after reboot)
    copy:
      src: files/zfs.modprobe.conf
      dest: /etc/modprobe.d/zfs.conf
      owner: root
      group: root
      mode: 0644
    tags: [zfs, power]

  - name: Enable weekly ZFS trim on both pools
    # Safe for the HDDs: zpool trim queries per-vdev discard support and the
    # WD100EMAZ SMR drives report discard_max_bytes=0, so ZFS marks them
    # "(trim unsupported)" and skips them entirely (verified via
    # `zpool status -t z`, Oct 2026). The weekly z trim only touches the
    # special+logs NVMe regions and finishes in seconds. Cache vdevs are
    # never trimmed by ZFS by design (volatile cache, no wear benefit).
    systemd:
      name: "{{ item }}"
      enabled: true
      state: started
      daemon_reload: true
    loop:
      - zfs-trim-weekly@z.timer
      - zfs-trim-weekly@fast.timer
      - fstrim.timer
    tags: [zfs, power]
  # Scrub: live box uses the packaged /etc/cron.d/zfsutils-linux (monthly-ish).
  # zfs-scrub-*-@.timer units are disabled there — leave as packaged.

  # ---------------------------------------------------------------- network
  # Topology (2026-10-06): physical NICs -> bond0 (active-backup, primary
  # enp2s0) -> br0 (LAN bridge, DHCP). LXD (profile parent=br0) and podman
  # (host-mode + NAT egress) ride br0, so all container stacks egress via
  # the bond. Template filters bond_slaves against ansible_interfaces so a
  # BIOS-disabled NIC never breaks netplan.
  - name: Remove installer netplan (50-cloud-init.yaml; cloud-init is disabled)
    # Must go: it defines enp2s0 with dhcp4 and would override our config
    # (netplan merges by filename order, 50 > 01).
    file:
      path: /etc/netplan/50-cloud-init.yaml
      state: absent
    tags: [network]

  - name: Write netplan bond0->br0 config
    template:
      src: files/netplan.yaml.j2
      dest: /etc/netplan/01-bond-bridge.yaml
      owner: root
      group: root
      mode: 0600
    register: netplan_cfg
    tags: [network]

  - name: Apply netplan (bond topology change — brief network blip)
    # NOT run by default: moving enp2s0 out of br0 into bond0 re-converges
    # the bridge and can drop SSH for a few seconds. On a live box prefer
    # `sudo netplan try` (auto-rolls back on lockout). To apply via ansible:
    #   ansible-playbook ... --tags network --skip-tags never-run-automatically
    command: netplan apply
    when: netplan_cfg.changed
    tags: [network, never-run-automatically]

  # ---------------------------------------------------------------- nfs
  - name: Configure nfsd exports
    copy:
      src: files/exports
      dest: /etc/exports
      owner: root
      group: root
      mode: 0644
    register: exports
    tags: [nfs]
  # drift fixed: 192.168.1.1/24 -> 192.168.0.1/16, crossmnt added

  - name: export
    command: exportfs -a
    when: exports.changed
    tags: [nfs]

  - name: NFS mountd manage-gids (group-based ACLs across NFS)
    lineinfile:
      path: /etc/nfs.conf
      regex: '^#?manage-gids='
      line: 'manage-gids=y'
      insertafter: '^\[mountd\]'
    notify: restart nfs server
    tags: [nfs]

  # ---------------------------------------------------------------- samba
  - name: Samba z share
    blockinfile:
      path: /etc/samba/smb.conf
      create: false
      marker: "# {mark} ANSIBLE MANAGED BLOCK: z share"
      block: |
        [z]
           comment = z on bonus
           path = /z
           read only = no
           browsable = yes
           guest ok = no
           valid users = chiluk
    notify: restart smbd
    tags: [samba]

  - name: Enable smbd + nmbd
    systemd:
      name: "{{ item }}"
      enabled: true
      state: started
    loop: [smbd, nmbd]
    tags: [samba]

  # ---------------------------------------------------------------- podman
  # MIGRATION (2026-10-06): docker -> podman. Playbook now installs podman;
  # docker-ce is no longer installed on fresh builds. Live migration of the
  # plex/ARM containers happens at the 26.04 reinstall (see RECOVERY.md).
  #
  # noble ships podman 4.9.x (universe) with netavark + aardvark-dns —
  # no upstream repo needed. Rootful mode (system podman) matches the old
  # docker behavior for privileged ARM + /dev/dri passthrough.
  - name: Install podman + compose + network stack
    apt:
      force_apt_get: true
      state: present
      update_cache: true
      name:
        - podman
        - podman-compose
        - netavark
        - aardvark-dns
        - containernetworking-plugins   # CNI fallback / compat
        - slirp4netns                   # rootless net (future-proofing)
    tags: [podman]

  - name: Enable podman.socket (docker-compatible API for rootful podman)
    # Socket-activated: podman.service starts on demand, no need to enable it.
    systemd:
      name: podman.socket
      enabled: true
      state: started
    tags: [podman]

  - name: Docker CE stays absent (migrated to podman)
    apt:
      force_apt_get: true
      state: absent
      name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    tags: [podman]
  # Networking note: podman's default network (podman0, 10.88.0.0/16,
  # netavark-managed) is created automatically on first use and NATs
  # through the host default route = bond0, so bridged containers egress
  # via the bond. plex runs network_mode: host (direct bond0 egress);
  # ARM uses port mapping through the same route. No custom network files
  # needed — hand-written netavark JSON with fixed IDs is fragile; let
  # podman own it. For a LAN-attached network later:
  #   podman network create --bridge br0 lan
  #
  # On the CURRENT live box the absent-task would remove docker while
  # plex/ARM still run on it — that's why live migration is deferred to
  # the 26.04 reinstall. On a fresh install it's a no-op. To keep docker
  # on the live box until then: --skip-tags podman.

  # ---------------------------------------------------------------- lxd
  - name: Install LXD snap (5.21/stable)
    snap:
      name: lxd
      channel: 5.21/stable
      state: present
    tags: [lxd]

  - name: LXD storage pool fast on the fast ZFS pool
    # Run as the chiluk user (member of lxd group) after `lxd init` has been done.
    command: lxc storage create fast zfs source=fast/lxd
    become_user: chiluk
    register: lxc_storage
    failed_when: lxc_storage.rc != 0 and 'already exists' not in lxc_storage.stderr
    changed_when: lxc_storage.rc == 0
    tags: [lxd]

  - name: Read LXD default profile eth0 parent
    command: lxc profile device get default eth0 parent
    become_user: chiluk
    register: lxc_eth0_parent
    changed_when: false
    failed_when: lxc_eth0_parent.rc != 0 and 'not found' not in (lxc_eth0_parent.stderr | default(''))
    tags: [lxd]

  - name: LXD default profile NIC rides br0 (bond-backed bridge)
    # Idempotent: only sets when parent isn't already br0. Live box already
    # has this; the task asserts it so reinstalls match. Instances using the
    # default profile egress via bond0.
    command: lxc profile device set default eth0 parent=br0 nictype=bridged
    become_user: chiluk
    when: lxc_eth0_parent.stdout | default('') | trim != 'br0'
    tags: [lxd]

  # ---------------------------------------------------------------- ugreen leds
  # miskcoo/ugreen_leds_controller v0.3. Live bonus installs the OFFICIAL release
  # debs (led-ugreen-dkms + led-ugreen-utils); the dkms deb's postinst runs
  # `dkms add/build/install` itself, so we do NOT hand-clone the kmod (that would
  # fight dpkg ownership of /usr/src/led-ugreen-0.3). Services intentionally left
  # DISABLED: ugreen-diskiomon churns the i801 SMBus ~25/s and blocks s0ix.
  - name: Install ugreen LED debs (dkms kmod + utils) from GitHub release
    # NOTE: apt's `deb` parameter is a single path/URL (type=path), NOT a list —
    # passing a list makes it try to fetch the literal "['https://...'" string.
    # Loop one URL per task invocation instead.
    apt:
      deb: "{{ item }}"
      state: present
    loop:
      - https://github.com/miskcoo/ugreen_leds_controller/releases/download/v0.3/led-ugreen-dkms_0.3_amd64.deb
      - https://github.com/miskcoo/ugreen_leds_controller/releases/download/v0.3/led-ugreen-utils_0.3_amd64.deb
    tags: [leds]

  - name: ugreen LED modules autoload
    # The debs ship NO modules-load file, so we add it.
    copy:
      dest: /etc/modules-load.d/ugreen-led.conf
      content: |
        i2c-dev
        led-ugreen
        ledtrig-oneshot
        ledtrig-netdev
      owner: root
      group: root
      mode: 0644
    tags: [leds]

  - name: ugreen LED daemon config (colors/brightness/health checks)
    # User copy of the deb's /etc/ugreen-leds.example.conf with local tweaks
    # (brightness 128, CHECK_ZPOOL=true, check intervals 60s). Nothing else in
    # ansible sets this; the deb only ships the .example.
    copy:
      src: files/ugreen-leds.conf
      dest: /etc/ugreen-leds.conf
      owner: root
      group: root
      mode: 0644
    tags: [leds]

  - name: ugreen LED daemons stay disabled (s0ix blocker)
    # The led-ugreen-utils deb ships ugreen-probe-leds / ugreen-diskiomon /
    # ugreen-netdevmon@. On live bonus all three are disabled. If you ever want
    # the front-panel LEDs back, enable probe-leds + netdevmon only; keep
    # diskiomon off (LED churn ~25/s over SMBus defeats package sleep).
    systemd:
      name: "{{ item }}"
      enabled: no
      state: stopped
      daemon_reload: true
    loop:
      - ugreen-diskiomon.service
      - ugreen-probe-leds.service
      - ugreen-netdevmon@enp2s0.service
    failed_when: false   # units may not exist until utils deb is installed
    tags: [leds, power]

  # ---------------------------------------------------------------- power / iGPU
  - name: i915/xe deep-power module options
    copy:
      src: files/i915.modprobe.conf
      dest: /etc/modprobe.d/i915.conf
      owner: root
      group: root
      mode: 0644
    tags: [power]

  - name: Disable DRM KMS polling (headless box)
    copy:
      src: files/drm-poll.modprobe.conf
      dest: /etc/modprobe.d/drm-poll.conf
      owner: root
      group: root
      mode: 0644
    tags: [power]

  - name: NIC ASPM / WOL options (r8127)
    copy:
      src: files/r8127.modprobe.conf
      dest: /etc/modprobe.d/r8127.conf
      owner: root
      group: root
      mode: 0644
    tags: [power]

  - name: Enable intel_lpmd + thermald
    systemd:
      name: "{{ item }}"
      enabled: true
      state: started
    loop: [intel_lpmd, thermald]
    tags: [power]

  # ---------------------------------------------------------------- security
  - name: Configure sshd
    lineinfile:
      path: /etc/ssh/sshd_config
      regex: "^(#)?{{item.key}}"
      line: "{{item.key}} {{item.value}}"
      state: present
    loop:
      - { key: "PermitRootLogin", value: "no" }
      - { key: "PasswordAuthentication", value: "no" }
    notify:
      - restart sshd
    tags: [security]

  - name: Deploy chiluk authorized_keys (indeed + 2x lp-chiluk + herby)
    copy:
      src: files/authorized_keys_chiluk
      dest: /home/chiluk/.ssh/authorized_keys
      owner: chiluk
      group: chiluk
      mode: 0600
    tags: [security]

  - name: create fail2ban/jail.local
    copy:
      src: files/jail.local
      dest: /etc/fail2ban/jail.local
      owner: root
      group: root
      mode: 0644
    notify: restart fail2ban
    tags: [security]
  # NOTE: Ubuntu noble's packaged /etc/fail2ban/jail.d/defaults-debian.conf
  # enables the sshd jail with nftables+systemd backend. jail.local (byte-identical
  # to live) does not override that. No extra jail.d file needed.

  - name: ufw stays installed but disabled (matches live ENABLED=no)
    ufw:
      state: disabled
    tags: [security]

  # Flush handlers mid-play so sshd/fail2ban restarts land before we finish.
  - name: Flush handlers
    meta: flush_handlers
    tags: [security]

  # ---------------------------------------------------------------- hdparm
  - name: Configure hdparm to spin down drives
    copy:
      src: files/hdparm.conf
      dest: /etc/hdparm.conf
      owner: root
      group: root
      mode: 0644
    register: hdparm
    tags: [power]

  - name: run hdparm
    command: /usr/lib/pm-utils/power.d/95hdparm-apm resume
    when: hdparm.changed
    tags: [power]

  # ---------------------------------------------------------------- livepatch
  - name: Install canonical-livepatch snap (enable needs token - manual)
    snap:
      name: canonical-livepatch
      state: present
    tags: [packages]
  # Live bonus: installed but NOT enabled ("Machine is not enabled").
  # After run: sudo canonical-livepatch enable <token from ubuntu.com/advantage>

  handlers:
    - name: restart sshd
      service:
        name: ssh
        state: restarted

    - name: restart fail2ban
      service:
        name: fail2ban
        state: restarted

    - name: restart nfs server
      service:
        name: nfs-server
        state: restarted

    - name: restart smbd
      service:
        name: smbd
        state: restarted
